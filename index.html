<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b10">
<meta name="description" content="NERO OS — your space on the web.">
<title>NERO OS</title>
<style>
:root{color-scheme:dark;--accent:#8db7ff;--glass:rgba(15,19,27,.66);--line:rgba(255,255,255,.13);--muted:#a9afbb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#f8f9fc;font-family:Inter,"Segoe UI",system-ui,sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer;border:0}
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#6aa1d5 0%,#a9c8df 35%,#5c7772 68%,#15221e 100%);isolation:isolate}
#scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 18%,#fff8 0,transparent 28%),linear-gradient(90deg,#111a23aa,transparent 35%,transparent 68%,#10191c88);z-index:-1}
#scene:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#080b10a8,transparent 46%,#07111c22);z-index:2;pointer-events:none}
.landscape{position:absolute;inset:0;overflow:hidden;filter:saturate(1.1)}
.sun{position:absolute;width:190px;height:190px;border-radius:50%;background:#fff8;filter:blur(40px);top:8%;left:54%}
.hill{position:absolute;bottom:15%;width:75vw;height:42vh;border-radius:50% 50% 0 0;filter:blur(2px)}
.hill.one{left:-10%;background:linear-gradient(145deg,#a4c5a0,#526d58 72%);transform:rotate(-8deg)}
.hill.two{right:-18%;background:linear-gradient(210deg,#b1cba2,#3b5c4b 72%);transform:rotate(9deg)}
.water{position:absolute;bottom:-12%;left:10%;width:80%;height:44%;background:linear-gradient(180deg,#83a9a4aa,#172b37);border-radius:50% 50% 0 0;transform:perspective(400px) rotateX(14deg);box-shadow:inset 0 8px 25px #e7ffff55}
.tree{position:absolute;bottom:23%;width:20px;height:35%;background:#47372f;box-shadow:0 25px 0 #47372f}
.tree:before{content:"";position:absolute;width:190px;height:170px;left:-85px;top:-110px;background:radial-gradient(circle at 30% 40%,#f3c5dc 0 18%,transparent 19%),radial-gradient(circle at 70% 35%,#eab6d2 0 23%,transparent 24%),radial-gradient(circle at 48% 70%,#cfa3cf 0 28%,transparent 29%),radial-gradient(circle,#f0c6dd,#967aa7 70%);clip-path:polygon(12% 20%,30% 0,53% 10%,70% 0,100% 25%,88% 58%,100% 83%,67% 100%,37% 88%,0 100%,12% 62%);filter:drop-shadow(0 12px 8px #17251d66)}
.tree.t1{left:12%;height:40%;transform:scale(1.2)}.tree.t2{left:34%;height:32%;transform:scale(.9)}.tree.t3{right:20%;height:45%;transform:scale(1.35)}.tree.t4{right:4%;height:33%;transform:scale(.9)}
.bamboo{position:absolute;bottom:12%;width:13px;height:35%;background:repeating-linear-gradient(0deg,#8bcf53 0 34px,#4e9a38 35px 39px);border-radius:4px;box-shadow:12px 20px 0 -2px #6fb64a,-10px 40px 0 -3px #6fb64a}
.b1{left:7%}.b2{left:27%;height:26%}.b3{right:32%;height:30%}.b4{right:10%;height:40%}.b5{right:2%;height:32%}
#lock{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:opacity .55s,visibility .55s;background:#05070a16}
#lock.hidden{opacity:0;visibility:hidden;pointer-events:none}
#lock .day{font-size:clamp(42px,7vw,76px);font-weight:300;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 22px #0004}
#lock .date{font-size:14px;font-weight:750;letter-spacing:.28em;margin-top:12px;text-transform:uppercase}
#lock .time{font-size:13px;letter-spacing:.18em;margin-top:13px}
#lock .hint{position:absolute;bottom:8%;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#ffffffb8;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.45}}
#desktop{position:fixed;inset:0;z-index:5;opacity:0;pointer-events:none;transition:opacity .5s}
#desktop.ready{opacity:1;pointer-events:auto}
#topline{position:absolute;top:24px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:center;color:#ffffffb8;font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 1px 8px #0008}
#brand{font-weight:800;letter-spacing:.22em;color:#fff}
#widgets{position:absolute;right:3.2%;top:8%;width:min(300px,28vw);display:flex;flex-direction:column;gap:21px}
.widget-label{font-size:10px;letter-spacing:.17em;color:#ffffff80;margin-bottom:-12px}
.widget{background:var(--glass);backdrop-filter:blur(24px) saturate(1.3);border:1px solid var(--line);border-radius:17px;min-height:73px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 38px #0002}
.widget-icon{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:#ffffff15;font-size:22px;flex:none}
.widget strong{display:block;font-size:12px;font-weight:650}.widget small{display:block;color:#ffffffa0;font-size:10px;margin-top:4px}
.widget.action{cursor:pointer;justify-content:space-between}.widget.action:hover{background:#ffffff22}
#dock{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid #ffffff22;border-radius:20px;background:rgba(8,11,16,.76);backdrop-filter:blur(28px);box-shadow:0 10px 40px #0005}
.dock-btn{width:43px;height:43px;border-radius:12px;background:transparent;display:grid;place-items:center;font-size:23px;transition:transform .18s,background .18s;position:relative}
.dock-btn:hover{background:#ffffff20;transform:translateY(-7px) scale(1.08)}
.dock-btn .tip{position:absolute;bottom:55px;white-space:nowrap;font-size:10px;background:#111b;color:#fff;padding:6px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s}
.dock-btn:hover .tip{opacity:1}
.dock-sep{height:27px;width:1px;background:#ffffff30;margin:0 5px}
#fps{position:absolute;left:24px;bottom:24px;background:#080a0de8;border:1px solid #ffffff20;border-radius:8px;padding:8px 12px;font-size:10px;font-weight:700;box-shadow:0 5px 18px #0004}
#launcher{position:absolute;inset:0;z-index:15;background:#050609f5;display:none;align-items:flex-start;justify-content:center;padding:10vh 20px 30px}
#launcher.show{display:flex}
.launch-inner{width:min(820px,100%)}
#search{width:100%;height:43px;border:1px solid #ffffff22;border-radius:9px;background:#ffffff12;color:white;padding:0 16px;outline:none;font-size:13px}
#search:focus{border-color:#ffffff70}
#apps{display:grid;grid-template-columns:repeat(7,minmax(65px,1fr));gap:23px 10px;margin-top:34px}
.app{background:transparent;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0;font-size:11px}
.app:hover .app-icon{transform:translateY(-4px);filter:brightness(1.15)}
.app-icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:28px;transition:.18s;box-shadow:0 8px 22px #0005}
.app span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#windowLayer{position:absolute;inset:0;pointer-events:none;z-index:10}
.window{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 28px));height:min(420px,calc(100vh - 120px));background:rgba(14,17,23,.94);border:1px solid #ffffff28;border-radius:15px;box-shadow:0 28px 90px #0009;backdrop-filter:blur(30px);overflow:hidden;pointer-events:auto;display:flex;flex-direction:column}
.window-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ffffff18;font-size:12px}
.window-head button{background:#ffffff15;border-radius:7px;width:27px;height:27px}
.window-body{padding:22px;overflow:auto;flex:1;color:#f3f4f8;font-size:13px}
.window-body input,.window-body textarea{width:100%;background:#ffffff12;border:1px solid #ffffff25;color:white;border-radius:8px;padding:11px;outline:none}
.window-body textarea{height:220px;resize:vertical}
.settings-line{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #ffffff18}
.swatches{display:flex;gap:8px}.swatch{width:23px;height:23px;border-radius:50%;border:2px solid #fff7}
#toast{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:#101722eF;border:1px solid #ffffff28;border-radius:9px;padding:11px 16px;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}#toast.show{opacity:1}
@media(max-width:700px){#widgets{right:14px;top:15%;width:220px;gap:16px}.widget{min-height:62px;padding:11px}.widget-icon{width:33px;height:33px}.widget strong{font-size:11px}#topline{left:18px;right:18px;top:16px}#apps{grid-template-columns:repeat(4,minmax(55px,1fr));gap:21px 8px;margin-top:25px}.app-icon{width:52px;height:52px}#dock{bottom:12px;gap:2px;padding:7px 8px}.dock-btn{width:38px;height:40px;font-size:20px}.dock-sep{margin:0 2px}#fps{left:12px;bottom:16px}}
@media(max-width:430px){#widgets{width:190px;top:17%}.widget-label{font-size:9px}.widget{border-radius:13px}.widget small{font-size:9px}#dock .optional{display:none}#lock .date{font-size:11px}.tree:before{transform:scale(.75)}}
</style>
</head>
<body>
<div id="scene" aria-hidden="true">
 <div class="landscape"><div class="sun"></div><div class="hill one"></div><div class="hill two"></div><div class="water"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="bamboo b1"></div><div class="bamboo b2"></div><div class="bamboo b3"></div><div class="bamboo b4"></div><div class="bamboo b5"></div></div>
</div>
<section id="lock" aria-label="Lock screen">
 <div class="day" id="lockDay">Thursday</div><div class="date" id="lockDate">26 November, 2026</div><div class="time" id="lockTime">15:10</div><div class="hint">Click or press any key to continue</div>
</section>
<main id="desktop">
 <div id="topline"><span id="brand">N E R O&nbsp; O S</span><span id="desktopDate"></span></div>
 <aside id="widgets">
  <div class="widget-label">JUMP BACK IN</div>
  <div class="widget"><div class="widget-icon" style="color:#ffbd32">◆</div><div><strong>PS5 Library Ready</strong><small>PS5 Emu</small></div></div>
  <div class="widget-label">QUICK PLAY</div>
  <div class="widget"><div class="widget-icon" style="color:#1ed760">◉</div><div><strong>Not Playing</strong><small>Spotify</small></div></div>
  <div class="widget-label">SYSTEM STATUS</div>
  <button class="widget action" id="updates"><span><strong>Update Log</strong><small>View latest patches</small></span><span style="font-size:24px;color:#ffffff90">›</span></button>
 </aside>
 <div id="windowLayer"></div>
 <div id="dock">
  <button class="dock-btn" id="homeBtn" title="Start"><span style="color:#54b8ff">⊞</span><span class="tip">Start</span></button>
  <div class="dock-sep"></div>
  <button class="dock-btn" id="launcherBtn" title="Apps"><span style="font-size:20px">▦</span><span class="tip">All apps</span></button>
  <div class="dock-sep"></div>
  <button class="dock-btn" data-app="movies"><span style="color:#e50914;font-weight:900">N</span><span class="tip">NERO Movies</span></button>
  <button class="dock-btn" data-app="spotify"><span style="color:#1ed760">◉</span><span class="tip">Spotify</span></button>
  <button class="dock-btn" data-app="playstation"><span style="color:#4a9cff">▣</span><span class="tip">PS5 Emu</span></button>
  <button class="dock-btn optional" data-app="browser"><span>◉</span><span class="tip">Cine-Web</span></button>
  <button class="dock-btn optional" data-app="settings"><span>⚙</span><span class="tip">Settings</span></button>
 </div>
 <div id="fps">60 FPS</div><div id="toast"></div>
</main>
<section id="launcher" aria-label="App launcher">
 <div class="launch-inner"><input id="search" type="search" placeholder="⌕   Search apps..." autocomplete="off"><div id="apps">
  <button class="app" data-app="movies"><span class="app-icon" style="background:#090909;color:#e50914;font-weight:900">N</span><span>CINE // HUB</span></button>
  <button class="app" data-app="spotify"><span class="app-icon" style="background:#080808;color:#1ed760">◉</span><span>Spotify</span></button>
  <button class="app" data-app="playstation"><span class="app-icon" style="background:#0753a5">▣</span><span>PS5 Emu</span></button>
  <button class="app" data-app="browser"><span class="app-icon" style="background:#080808">◉</span><span>Cine-Web</span></button>
  <button class="app" data-app="settings"><span class="app-icon" style="background:linear-gradient(145deg,#ddd,#777);color:#222">⚙</span><span>CONFIG</span></button>
  <button class="app" data-app="discord"><span class="app-icon" style="background:#5865f2">☁</span><span>Discord</span></button>
  <button class="app" data-app="roblox"><span class="app-icon" style="background:#315bff">◇</span><span>Roblox</span></button>
  <button class="app" data-app="android"><span class="app-icon" style="background:#111;color:#83d17b">♟</span><span>Android</span></button>
  <button class="app" data-app="linux"><span class="app-icon" style="background:#111">◈</span><span>Cini AI</span></button>
  <button class="app" data-app="vm"><span class="app-icon" style="background:#172e50">▣</span><span>Windows Virtual-Machine</span></button>
  <button class="app" data-app="crunchyroll"><span class="app-icon" style="background:#111;color:#ff8a00">◉</span><span>CrunchyRoll</span></button>
  <button class="app" data-app="gfn"><span class="app-icon" style="background:#76b900">◩</span><span>GEFORCE NOW</span></button>
  <button class="app" data-app="fortnite"><span class="app-icon" style="background:#42bde9">F</span><span>Fortnite</span></button>
  <button class="app" data-app="rocket"><span class="app-icon" style="background:#17466c">🚗</span><span>Rocket League</span></button>
  <button class="app" data-app="xbox"><span class="app-icon" style="background:#107c10">✕</span><span>Xbox</span></button>
 </div></div>
</section>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const apps={
 movies:["CINE // HUB","Your entertainment hub is ready."],spotify:["Spotify","Music controls will appear here when connected."],playstation:["PS5 Emu","Your PlayStation library shortcut."],browser:["Cine-Web","A browser shortcut. Web browsing is not built into this preview."],discord:["Discord","Your Discord shortcut."],roblox:["Roblox","Your Roblox shortcut."],android:["Android","Android tools and shortcuts."],linux:["Cini AI","AI workspace shortcut."],vm:["Windows Virtual-Machine","Virtual machine shortcut."],crunchyroll:["CrunchyRoll","Anime shortcut."],gfn:["GEFORCE NOW","Cloud gaming shortcut."],fortnite:["Fortnite","Game shortcut."],rocket:["Rocket League","Game shortcut."],xbox:["Xbox","Game shortcut."],updates:["NERO OS Update Log","Welcome to the first NERO OS preview. More apps and features are coming."]
};
function updateClock(){const d=new Date();$('#lockDay').textContent=d.toLocaleDateString(undefined,{weekday:'long'});$('#lockDate').textContent=d.toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'}).toUpperCase();$('#lockTime').textContent=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',hour12:false});$('#desktopDate').textContent=d.toLocaleDateString(undefined,{weekday:'short',day:'2-digit',month:'short'}).toUpperCase()}
updateClock();setInterval(updateClock,1000);
function unlock(){if($('#lock').classList.contains('hidden'))return;$('#lock').classList.add('hidden');$('#desktop').classList.add('ready')}
$('#lock').addEventListener('click',unlock);document.addEventListener('keydown',e=>{if(!$('#lock').classList.contains('hidden')){unlock();return}if(e.key==='Escape'){$('#launcher').classList.remove('show');$('#search').blur()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();toggleLauncher(true)}});
function toggleLauncher(force){const l=$('#launcher');l.classList.toggle('show',force===undefined?!l.classList.contains('show'):force);if(l.classList.contains('show')){$('#search').value='';filterApps('');setTimeout(()=>$('#search').focus(),30)}}
$('#homeBtn').onclick=()=>toggleLauncher();$('#launcherBtn').onclick=()=>toggleLauncher();
function openApp(id){if(id==='settings'){openWindow('Settings','<div class="settings-line"><span>Accent color</span><div class="swatches"><button class="swatch" data-color="#8db7ff" style="background:#8db7ff"></button><button class="swatch" data-color="#c39aff" style="background:#c39aff"></button><button class="swatch" data-color="#5ed6b0" style="background:#5ed6b0"></button><button class="swatch" data-color="#ffae78" style="background:#ffae78"></button></div></div><div class="settings-line"><span>Show FPS counter</span><input id="fpsToggle" type="checkbox" checked style="width:auto"></div><div class="settings-line"><span>Lock screen</span><button id="lockAgain" style="background:#ffffff18;padding:8px 12px;border-radius:7px">Lock now</button></div><p style="color:#a9afbb;font-size:11px">NERO OS Preview · Version 1.0</p>');return}
let [name,desc]=apps[id]||["NERO OS", "This app is not configured yet."];openWindow(name,'<div style="display:grid;place-items:center;text-align:center;height:100%;min-height:220px"><div><div style="font-size:42px;margin-bottom:14px">✦</div><h2 style="font-size:18px;margin:0 0 8px">'+name+'</h2><p style="color:#a9afbb;max-width:340px;line-height:1.6">'+desc+'</p><small style="color:#747d8b">NERO OS app shortcut</small></div></div>')}
function openWindow(title,content){const w=document.createElement('section');w.className='window';w.innerHTML='<div class="window-head"><strong>'+title+'</strong><button aria-label="Close">×</button></div><div class="window-body">'+content+'</div>';$('#windowLayer').append(w);w.querySelector('.window-head button').onclick=()=>w.remove();w.addEventListener('pointerdown',()=>{ $$('.window').forEach(x=>x.style.zIndex=10);w.style.zIndex=11});w.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>document.documentElement.style.setProperty('--accent',b.dataset.color));const f=w.querySelector('#fpsToggle');if(f)f.onchange=()=>$('#fps').style.display=f.checked?'block':'none';const lock=w.querySelector('#lockAgain');if(lock)lock.onclick=()=>{w.remove();$('#desktop').classList.remove('ready');$('#lock').classList.remove('hidden')}}
$$('[data-app]').forEach(b=>b.addEventListener('click',()=>{toggleLauncher(false);openApp(b.dataset.app)}));
$('#updates').onclick=()=>openApp('updates');
$('#search').addEventListener('input',e=>filterApps(e.target.value));
function filterApps(q){$$('#apps .app').forEach(a=>a.style.display=a.textContent.toLowerCase().includes(q.toLowerCase())?'flex':'none')}
let frames=0,last=performance.now();function fpsLoop(now){frames++;if(now-last>=1000){$('#fps').textContent=Math.round(frames*1000/(now-last))+' FPS';frames=0;last=now}requestAnimationFrame(fpsLoop)}requestAnimationFrame(fpsLoop);
</script>
</body>
</html>
