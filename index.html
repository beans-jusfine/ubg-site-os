<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><meta name="description" content="NERO OS — a web desktop experience.">
<title>NERO OS</title>
<style>
:root{--accent:#69a9ff;--glass:rgba(18,27,43,.78);--line:rgba(255,255,255,.16);--text:#f7f9ff;--muted:#c3cede}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Segoe UI,Inter,system-ui,sans-serif;color:var(--text);background:#101827}button,input{font:inherit}button{color:inherit;border:0;cursor:pointer}
#desktop{position:relative;height:100%;overflow:hidden;background:radial-gradient(ellipse at 72% 38%,rgba(38,130,230,.78),transparent 34%),radial-gradient(ellipse at 65% 65%,rgba(112,62,205,.7),transparent 33%),linear-gradient(135deg,#071326 5%,#102b55 48%,#171735 100%);background-size:cover}
#desktop:before{content:"";position:absolute;width:60vw;height:60vw;max-width:760px;max-height:760px;border-radius:50%;left:50%;top:48%;transform:translate(-50%,-50%);background:conic-gradient(from 40deg,transparent,#5ab6ff55,#a38bff66,transparent 65%);filter:blur(48px);pointer-events:none}
#desktopIcons{position:absolute;z-index:1;top:18px;left:14px;display:grid;grid-auto-flow:row;grid-template-columns:82px;gap:10px}
.desk-icon{width:76px;min-height:78px;padding:7px 3px;border-radius:8px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;text-shadow:0 1px 4px #000;text-align:center;font-size:12px}.desk-icon:hover,.desk-icon:focus{background:#ffffff20;outline:1px solid #ffffff35}.appico{height:38px;width:42px;border-radius:11px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#ffffff35,#ffffff0c);border:1px solid #ffffff35;box-shadow:0 5px 15px #0002}
#taskbar{position:absolute;z-index:1000;bottom:0;left:0;right:0;height:58px;background:rgba(15,23,37,.76);backdrop-filter:blur(28px) saturate(1.5);border-top:1px solid #ffffff22;display:flex;align-items:center;justify-content:center;padding:0 12px}
#taskCenter{display:flex;align-items:center;gap:5px;height:100%}.task-btn{height:43px;min-width:43px;padding:0 10px;border-radius:9px;background:transparent;font-size:21px;display:grid;place-items:center;position:relative}.task-btn:hover,.task-btn.active{background:#ffffff20}.task-btn.running:after{content:"";position:absolute;bottom:2px;width:15px;height:3px;border-radius:4px;background:var(--accent)}
#startBtn{font-size:24px;color:#83baff}#tray{position:absolute;right:14px;display:flex;align-items:center;gap:13px;font-size:12px;color:#f3f6fc}#clock{text-align:right;line-height:1.45;min-width:74px}
#startMenu{position:absolute;z-index:900;bottom:68px;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));height:min(650px,calc(100vh - 90px));border:1px solid #ffffff26;border-radius:16px;background:rgba(22,31,48,.91);backdrop-filter:blur(35px);box-shadow:0 24px 80px #0008;padding:25px;display:none;flex-direction:column;gap:20px}#startMenu.show{display:flex}
.searchbox{height:42px;border:1px solid #ffffff30;border-radius:7px;background:#ffffff12;display:flex;align-items:center;gap:10px;padding:0 13px}.searchbox input{background:transparent;border:0;outline:0;color:white;width:100%}.section-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}.all-btn{background:#ffffff14;border:1px solid #ffffff20;border-radius:5px;padding:5px 10px;font-size:11px}
#pinned{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 8px}.pin{background:transparent;border-radius:8px;padding:9px 2px;display:flex;align-items:center;flex-direction:column;gap:8px;font-size:11px}.pin:hover{background:#ffffff18}.pin .appico{width:43px;height:43px;font-size:24px}
#startBottom{margin-top:auto;margin-left:-25px;margin-right:-25px;margin-bottom:-25px;padding:13px 25px;background:#ffffff0c;border-radius:0 0 16px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.window{position:absolute;z-index:10;min-width:280px;min-height:190px;width:620px;height:420px;max-width:calc(100vw - 20px);max-height:calc(100vh - 76px);border-radius:11px;overflow:hidden;background:rgba(246,248,252,.96);color:#202b3b;box-shadow:0 18px 60px #0006;border:1px solid #ffffffaa;display:flex;flex-direction:column}.window.focused{z-index:50;box-shadow:0 24px 80px #0008}.window.maximized{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 74px)!important;max-width:none;max-height:none;border-radius:8px}
.titlebar{height:42px;flex-shrink:0;background:#f5f7fa;display:flex;align-items:center;justify-content:space-between;padding-left:14px;user-select:none;cursor:move;border-bottom:1px solid #e4e8ef;font-size:12px}.win-title{display:flex;align-items:center;gap:9px}.win-controls{height:100%;display:flex}.win-controls button{width:45px;background:transparent;color:#334155;font-size:13px}.win-controls button:hover{background:#e2e7ee}.win-controls .close:hover{background:#d92d42;color:white}.window-content{flex:1;overflow:auto;background:#f8fafc;padding:18px}.window-content.dark{background:#202938;color:#f4f6fa}
.explorer-layout{display:grid;grid-template-columns:155px 1fr;height:100%;gap:15px}.side-nav{border-right:1px solid #e1e6ed;padding-right:10px;color:#536174;font-size:12px}.side-nav div{padding:9px;border-radius:5px}.side-nav div:first-child{background:#e5edf9;color:#1e4c85}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));align-content:start;gap:14px}.file-item{padding:12px 5px;text-align:center;border-radius:7px;font-size:11px;color:#334155}.file-item:hover{background:#e8eef7}.file-item b{display:block;font-size:28px;margin-bottom:8px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:15px 5px;border-bottom:1px solid #e4e8ef;font-size:13px}.settings-row small{display:block;color:#64748b;margin-top:4px}.accent-swatch{width:25px;height:25px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #999}
#context{position:absolute;z-index:1200;display:none;width:205px;padding:6px;background:rgba(28,38,55,.96);backdrop-filter:blur(20px);border:1px solid #ffffff2c;border-radius:8px;box-shadow:0 12px 35px #0006;font-size:12px}#context button{display:block;width:100%;text-align:left;background:transparent;padding:9px;border-radius:5px}#context button:hover{background:#ffffff20}
#toast{position:absolute;z-index:1500;bottom:75px;left:50%;transform:translateX(-50%);background:#172338eF;border:1px solid #ffffff30;border-radius:8px;padding:10px 16px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}
#shutdown{display:none;position:absolute;inset:0;z-index:2000;background:#080e1a;align-items:center;justify-content:center;flex-direction:column;gap:16px}#shutdown.show{display:flex}
@media(max-width:600px){#desktopIcons{grid-template-columns:70px;top:10px;left:6px}.desk-icon{width:66px}.window{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 74px)!important;max-width:none;max-height:none}.explorer-layout{grid-template-columns:95px 1fr}.side-nav{font-size:10px}#startMenu{padding:18px}#pinned{grid-template-columns:repeat(4,1fr)}#tray{gap:7px;right:8px}#taskbar{justify-content:flex-start}#taskCenter{margin:auto}#clock{min-width:60px;font-size:10px}}
</style>
</head>
<body>
<div id="desktop">
 <div id="desktopIcons">
  <button class="desk-icon" data-app="explorer"><span class="appico">📁</span>This PC</button>
  <button class="desk-icon" data-app="browser"><span class="appico">🌐</span>NERO Browser</button>
  <button class="desk-icon" data-app="notes"><span class="appico">📝</span>Notepad</button>
  <button class="desk-icon" data-app="settings"><span class="appico">⚙️</span>Settings</button>
  <button class="desk-icon" data-app="about"><span class="appico">◈</span>About NERO</button>
 </div>
 <div id="windows"></div>
 <div id="startMenu">
  <div class="searchbox">⌕ <input id="appSearch" placeholder="Search for apps, settings, and documents"></div>
  <div class="section-head"><span>Pinned</span><button class="all-btn" id="allApps">All apps　›</button></div>
  <div id="pinned">
   <button class="pin" data-app="browser"><span class="appico">🌐</span>NERO Browser</button><button class="pin" data-app="explorer"><span class="appico">📁</span>File Explorer</button><button class="pin" data-app="settings"><span class="appico">⚙️</span>Settings</button><button class="pin" data-app="notes"><span class="appico">📝</span>Notepad</button><button class="pin" data-app="calculator"><span class="appico">🧮</span>Calculator</button><button class="pin" data-app="photos"><span class="appico">🖼️</span>Photos</button><button class="pin" data-app="about"><span class="appico">◈</span>About NERO</button>
  </div>
  <div class="section-head"><span>Recommended</span><button class="all-btn">More</button></div>
  <div style="font-size:12px;color:#c6d0df">Welcome to NERO OS. Your web desktop is ready.</div>
  <div id="startBottom"><span>◉　NERO User</span><button id="powerBtn" title="Power">⏻</button></div>
 </div>
 <div id="context"><button data-action="refresh">↻　Refresh</button><button data-action="newfolder">📁　New folder</button><button data-action="personalize">🎨　Personalize</button><button data-action="about">◈　About NERO OS</button></div>
 <div id="toast"></div>
 <div id="shutdown"><div style="font-size:38px;color:#82baff">◈ NERO</div><div>Shutting down…</div><button class="all-btn" id="restart">Restart</button></div>
 <div id="taskbar"><div id="taskCenter"><button class="task-btn" id="startBtn" title="Start">⊞</button><button class="task-btn" data-app="search" title="Search">⌕</button><button class="task-btn" data-app="browser" title="NERO Browser">🌐</button><button class="task-btn" data-app="explorer" title="File Explorer">📁</button><button class="task-btn" data-app="notes" title="Notepad">📝</button><button class="task-btn" data-app="settings" title="Settings">⚙️</button></div><div id="tray"><span>⌃</span><span>◖</span><span>◉</span><div id="clock"></div></div></div>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let z=20,winCount=0,notesText='Welcome to NERO OS!\n\nThis is your space to write.',calcValue='0';
const apps={
 explorer:{name:'File Explorer',icon:'📁',html:()=>'<div class="explorer-layout"><aside class="side-nav"><div>⌂　Home</div><div>▣　Desktop</div><div>↓　Downloads</div><div>▤　Documents</div><div>▣　Pictures</div><hr><div>▰　This PC</div></aside><section><div style="font-size:19px;margin:3px 0 18px">Home</div><div style="color:#64748b;font-size:12px;margin-bottom:12px">Quick access</div><div class="file-grid"><div class="file-item"><b>🖥️</b>Desktop</div><div class="file-item"><b>📥</b>Downloads</div><div class="file-item"><b>📄</b>Documents</div><div class="file-item"><b>🖼️</b>Pictures</div><div class="file-item"><b>🎵</b>Music</div><div class="file-item"><b>🎬</b>Videos</div></div><p style="font-size:11px;color:#94a3b8;margin-top:28px">NERO OS · Local demo workspace</p></section></div>'},
 browser:{name:'NERO Browser',icon:'🌐',html:()=>'<div style="display:flex;gap:7px;margin-bottom:14px"><input id="address" value="https://www.example.com" style="flex:1;border:1px solid #d5dce6;border-radius:6px;padding:9px;color:#334155"><button id="go" style="background:#1769c2;color:white;border-radius:6px;padding:0 16px">Go</button></div><div id="browserPage" style="height:calc(100% - 55px);background:white;border-radius:7px;padding:24px;color:#334155"><div style="font-size:25px;font-weight:650">Welcome to NERO Browser</div><p style="color:#64748b">A browser window preview inside NERO OS.</p><div style="background:#eff5ff;padding:16px;border-radius:8px;margin-top:22px">🌐　Enter a website address above. External browsing is not connected in this preview.</div></div>'},
 notes:{name:'Notepad',icon:'📝',html:()=>'<textarea id="noteArea" style="width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#263449;font:14px/1.7 Consolas,monospace">'+escapeHTML(notesText)+'</textarea>'},
 settings:{name:'Settings',icon:'⚙️',html:()=>'<div style="font-size:23px;font-weight:650;margin-bottom:5px">Settings</div><p style="font-size:12px;color:#64748b">Personalize your NERO experience.</p><div class="settings-row"><div>Appearance<small>Choose your desktop accent color</small></div><div style="display:flex;gap:9px"><button class="accent-swatch" data-color="#69a9ff" style="background:#69a9ff"></button><button class="accent-swatch" data-color="#a78bfa" style="background:#a78bfa"></button><button class="accent-swatch" data-color="#39c6a5" style="background:#39c6a5"></button><button class="accent-swatch" data-color="#f09a62" style="background:#f09a62"></button></div></div><div class="settings-row"><div>Display<small>Desktop resolution adapts to your screen</small></div><span>✓　Automatic</span></div><div class="settings-row"><div>System<small>NERO OS web preview</small></div><span>Version 0.1</span></div><div class="settings-row"><div>Personalization<small>Right-click the desktop to open options</small></div><span>›</span></div>'},
 calculator:{name:'Calculator',icon:'🧮',html:()=>'<div style="height:100%;display:flex;flex-direction:column;gap:12px"><input id="calcDisplay" value="0" readonly style="text-align:right;font-size:30px;padding:14px;border:0;background:#edf1f7;border-radius:7px;color:#243044"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1">'+['7','8','9','÷','4','5','6','×','1','2','3','−','C','0','.','+','=',''].map(x=>'<button class="calc-key" data-key="'+x+'" style="background:#e8edf4;border-radius:7px;color:#25334a;font-size:17px">'+x+'</button>').join('')+'</div></div>'},
 photos:{name:'Photos',icon:'🖼️',html:()=>'<div style="height:100%;display:grid;place-items:center;text-align:center;color:#64748b"><div><div style="font-size:56px">🖼️</div><b>No photos yet</b><p style="font-size:12px">Your images will appear here.</p></div></div>'},
 about:{name:'About NERO OS',icon:'◈',html:()=>'<div style="text-align:center;padding:24px"><div style="font-size:54px;color:#3988e9">◈</div><div style="font-size:28px;font-weight:700;color:#24344c">NERO OS</div><p style="color:#64748b">A new way to use the web.</p><div style="display:inline-block;background:#e8f1ff;color:#2563a9;padding:6px 12px;border-radius:20px;font-size:12px">Version 0.1.0 · Preview</div><p style="font-size:12px;color:#64748b;margin-top:26px">Inspired by modern desktop operating systems.<br>Built for the web by NERO.</p></div>'}
};
function escapeHTML(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2100)}
function openApp(id){if(id==='search'){ $('#startMenu').classList.add('show');$('#appSearch').focus();return}let a=apps[id];if(!a)return;let existing=$$('.window').find(w=>w.dataset.app===id);if(existing){existing.style.display='flex';focusWin(existing);$('#startMenu').classList.remove('show');return}
let w=document.createElement('section');w.className='window focused';w.dataset.app=id;w.style.left=Math.max(12,(innerWidth-620)/2+(winCount%5)*18)+'px';w.style.top=Math.max(12,(innerHeight-420)/2+(winCount%5)*14)+'px';w.style.zIndex=++z;winCount++;
w.innerHTML='<div class="titlebar"><div class="win-title"><span>'+a.icon+'</span>'+a.name+'</div><div class="win-controls"><button data-win="min">—</button><button data-win="max">□</button><button class="close" data-win="close">×</button></div></div><div class="window-content">'+a.html()+'</div><div class="resize-handle" style="position:absolute;right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize"></div>';
$('#windows').append(w);focusWin(w);$('#startMenu').classList.remove('show');wireWindow(w);updateTasks()}
function focusWin(w){$$('.window').forEach(x=>x.classList.remove('focused'));w.classList.add('focused');w.style.zIndex=++z;updateTasks()}
function updateTasks(){$$('.task-btn[data-app]').forEach(b=>b.classList.toggle('running',!!$$('.window').find(w=>w.dataset.app===b.dataset.app&&w.style.display!=='none')))}
function wireWindow(w){w.addEventListener('pointerdown',()=>focusWin(w));let bar=w.querySelector('.titlebar'),drag=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('.win-controls')||w.classList.contains('maximized'))return;focusWin(w);drag={x:e.clientX-w.offsetLeft,y:e.clientY-w.offsetTop};bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(drag){w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,e.clientX-drag.x))+'px';w.style.top=Math.max(0,Math.min(innerHeight-90,e.clientY-drag.y))+'px'}});bar.addEventListener('pointerup',()=>drag=null);
w.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{let a=b.dataset.win;if(a==='close'){w.remove();updateTasks()}if(a==='min'){w.style.display='none';updateTasks()}if(a==='max'){w.classList.toggle('maximized');if(!w.classList.contains('maximized')){w.style.width='620px';w.style.height='420px'}}});
let h=w.querySelector('.resize-handle');h.addEventListener('pointerdown',e=>{e.stopPropagation();let x=e.clientX,y=e.clientY,ww=w.offsetWidth,hh=w.offsetHeight;h.setPointerCapture(e.pointerId);let move=ev=>{w.style.width=Math.max(280,ww+ev.clientX-x)+'px';w.style.height=Math.max(190,hh+ev.clientY-y)+'px'};h.addEventListener('pointermove',move);h.addEventListener('pointerup',()=>h.removeEventListener('pointermove',move),{once:true})});
w.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--accent',b.dataset.color);toast('Accent color updated')});
let note=w.querySelector('#noteArea');if(note)note.addEventListener('input',()=>notesText=note.value);
let go=w.querySelector('#go');if(go)go.onclick=()=>{let v=w.querySelector('#address').value;w.querySelector('#browserPage').innerHTML='<div style="font-size:22px">🌐　'+escapeHTML(v)+'</div><p style="color:#64748b">External websites are not connected in this preview.</p>'};
w.querySelectorAll('.calc-key').forEach(b=>b.onclick=()=>{let k=b.dataset.key,d=w.querySelector('#calcDisplay');if(k==='C')calcValue='0';else if(k==='='){try{let expr=calcValue.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');if(!/^[0-9+*/.() -]+$/.test(expr))throw 0;calcValue=String(Function('return ('+expr+')')())}catch{calcValue='Error'}}else calcValue=calcValue==='0'?k:calcValue+k;d.value=calcValue});
}
$$('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
$('#startBtn').onclick=()=>$('#startMenu').classList.toggle('show');
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#startMenu,#startBtn'))$('#startMenu').classList.remove('show');if(!e.target.closest('#context'))$('#context').style.display='none'});
$('#appSearch').addEventListener('input',e=>{$$('#pinned .pin').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'flex':'none')});
$('#allApps').onclick=()=>{$('#appSearch').value='';$('#appSearch').focus();toast('Showing installed apps')};
$('#powerBtn').onclick=()=>{$('#startMenu').classList.remove('show');$('#shutdown').classList.add('show')};$('#restart').onclick=()=>{$('#shutdown').classList.remove('show');toast('NERO OS restarted')};
$('#desktop').addEventListener('contextmenu',e=>{if(e.target.closest('.window'))return;e.preventDefault();let c=$('#context');c.style.display='block';c.style.left=Math.min(e.clientX,innerWidth-215)+'px';c.style.top=Math.min(e.clientY,innerHeight-170)+'px'});
$('#context').onclick=e=>{let a=e.target.dataset.action;if(a==='personalize')openApp('settings');if(a==='about')openApp('about');if(a==='refresh')toast('Desktop refreshed');if(a==='newfolder')toast('New folders are not available in this preview');$('#context').style.display='none'};
function tick(){let d=new Date();$('#clock').innerHTML=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'<br>'+d.toLocaleDateString([],{month:'numeric',day:'numeric',year:'numeric'})}tick();setInterval(tick,1000);
</script>
</body></html>
